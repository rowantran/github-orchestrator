# gho settings for {repo}. `gho init` wrote this file; edit it freely.
# Settings shared by every repository are in ../../config.toml.
# Unknown keys are rejected, so a typo is an error and is never silently ignored. No credentials belong here.

# The GitHub Project that holds your queue for this repository:
# https://github.com/users/LOGIN/projects/N or https://github.com/orgs/ORG/projects/N
project_url = ""

# The branch that new worktrees start from when the issue has no blocker under review to stack on.
base_branch = "{base_branch}"
