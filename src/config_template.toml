# gho queue config. Fill in the empty [queue] values, then run `gho doctor`.
# GitHub remains the task store; no credentials belong in this file.
# Unknown keys are rejected, so a typo is an error and is never silently ignored.

[queue]
# The GitHub repository that holds your issues, as OWNER/REPO.
repo = ""
# Your GitHub login. Your queue is the open issues assigned to it, and branches are named <owner>/gh-N.
owner = ""
# The GitHub Project of your queue: https://github.com/users/LOGIN/projects/N or https://github.com/orgs/ORG/projects/N
project_url = ""
# Your clone of the repository. New worktrees are created from it. `~` is expanded.
checkout = ""
# The branch that new worktrees start from when the issue has no blocker under review to stack on.
base_branch = "main"

# Optional TaskNotes bridge: uncomment and set your Obsidian vault.
# [obsidian]
# vault = "~/Obsidian/Vault"

# Pi `--model` patterns the orchestrator launches agents with. Unset means your Pi default model.
[agents]
# implementer_model = "anthropic/claude-opus-4-5:high"
# reviewer_model = "openai/gpt-5"
