name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Worktrunk (wt) is not installed here, so its integration tests skip themselves.
      - run: cargo test --locked
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
# Live GitHub, a paid model and a real Obsidian vault are never used here.
