name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  orchestration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --global @earendil-works/pi-coding-agent@0.99.2
      - run: npm test
      - run: npm test && npm run build
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orchestration-browser-results
          path: tests/orchestration-browser/test-results/
          retention-days: 7
  obsidian:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
# Tests never use live GitHub, paid models, a real Tailscale daemon, or a real Obsidian vault.
