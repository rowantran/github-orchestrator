[package]
name = "github-orchestrator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Find ready GitHub issues and create Worktrunk worktrees for an orchestrator agent."
publish = false

[[bin]]
name = "gho"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
httparse = "1.10.1"
uuid = { version = "1.26.1", features = ["v4"] }
wait-timeout = "0.2.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
